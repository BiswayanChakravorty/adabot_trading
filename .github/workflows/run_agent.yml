name: Trading Agent Scan

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-agent-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q

      - name: Verify required secrets
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: test -n "$GROQ_API_KEY"

      - name: Run agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
        run: python trading_agent.py

      - name: Commit updated log
        run: |
          git config user.name "trading-agent-bot"
          git config user.email "actions@github.com"
          if [ -f trading_agent_log.jsonl ]; then
            git add trading_agent_log.jsonl
            if ! git diff --cached --quiet; then
              git commit -m "Log: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              git push
            fi
          fi
